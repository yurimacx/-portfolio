<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Painel</title>
  <link rel="icon" href="/assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <main class="block narrow">
    <section id="login">
      <h2>Entrar</h2>
      <form id="form-login">
        <label>E-mail <input name="email" type="email" required autocomplete="username"></label>
        <label>Senha <input name="password" type="password" required autocomplete="current-password"></label>
        <button class="btn" type="submit">Entrar</button>
      </form>
    </section>
    <section id="painel" hidden>
      <h2 id="titulo-form">Novo projeto</h2>
      <form id="form-projeto">
        <label>Título <input name="title" maxlength="120" required></label>
        <label>Descrição <textarea name="description" rows="3" maxlength="1000" required></textarea></label>
        <label>Tecnologias <input name="stack" maxlength="200"></label>
        <label>Link (https://…) <input name="url" type="url" maxlength="500"></label>
        <button class="btn" type="submit" id="salvar">Salvar projeto</button>
        <button class="btn ghost" type="button" id="cancelar" hidden>Cancelar edição</button>
      </form>
      <h2>Projetos publicados</h2>
      <div id="lista-admin"></div>
      <h2>Mensagens recebidas</h2>
      <div id="lista-msgs"></div>
      <button id="sair" class="btn ghost" type="button">Sair</button>
    </section>
    <p id="status" role="status" class="muted"></p>
  </main>
  <script src="/js/admin.js" defer></script>
</body>
</html>
